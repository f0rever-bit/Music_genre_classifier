# fly.toml app configuration file generated for music-genre-classifier on 2026-07-16T15:37:47+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'music-genre-classifier'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[mounts]
  source = "data_vol"
  destination = "/data"

[env]
  DATABASE_URL = 'sqlite:////data/app.db'
  ENVIRONMENT = 'production'
  UPLOAD_DIR = '/data/uploads'
  MODELS_DIR = '/data/models'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
