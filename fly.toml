# fly.toml app configuration file generated for music-genre-classifier on 2026-07-16T12:03:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'music-genre-classifier'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
